name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.x
          cache: true
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Test ASRL
        run: go test ./...
      - name: Build ASRL and DroidForge
        run: ./scripts/build-all.sh
      - name: Test CLI
        run: ./tests/cli_test.sh
      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh
